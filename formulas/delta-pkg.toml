[package]
repo = "dandavison/delta"
basename = "delta"
description = "delta is a syntax-highlighting pager for git. It helps to make the output of git commands more readable and visually appealing."
summary = "delta is a syntax-highlighting pager for git"
license = "MIT"

[download]
filename = "delta-\$DPKG_VERSION-x86_64-unknown-linux-gnu.tar.gz"
url_template = "https://github.com/\{repo}/releases/download/\{version}/\{filename}"
extract_cmd = "tar zxf"

[[install_files]]
source = "delta-0.18.2-x86_64-unknown-linux-gnu/delta"
permissions = "755"
dest = "/usr/bin/delta"

[[install_files]]
source = "delta-0.18.2-x86_64-unknown-linux-gnu/LICENSE"
permissions = "644"
dest = "/usr/share/delta/LICENSE"

[[install_files]]
source = "delta-0.18.2-x86_64-unknown-linux-gnu/README.md"
permissions = "644"
dest = "/usr/share/delta/README.md"

[cleanup]
files = "delta-0.18.2-x86_64-unknown-linux-gnu/delta delta-0.18.2-x86_64-unknown-linux-gnu/LICENSE delta-0.18.2-x86_64-unknown-linux-gnu/README.md"