[package]
repo = "ajeetdsouza/zoxide"
basename = "zoxide"
description = "zoxide is a smart cd command that teaches you to navigate faster by remembering your most used directories and provides a faster way to switch to them."
summary = "zoxide - a smarter cd command"
license = "MIT"

[download]
filename = "zoxide-\$DPKG_VERSION-x86_64-unknown-linux-musl.tar.gz"
url_template = "https://github.com/\{repo}/releases/download/\{version}/\{filename}"
extract_cmd = "tar zxf"

[[install_files]]
source = "zoxide"
permissions = "755"
dest = "/usr/bin/zoxide"

[[install_files]]
source = "man/man1/zoxide.1"
permissions = "644"
dest = "/usr/share/zoxide/man/man1/zoxide.1"

[[install_files]]
source = "man/man1/zoxide-add.1"
permissions = "644"
dest = "/usr/share/zoxide/man/man1/zoxide-add.1"

[[install_files]]
source = "man/man1/zoxide-remove.1"
permissions = "644"
dest = "/usr/share/zoxide/man/man1/zoxide-remove.1"

[[install_files]]
source = "man/man1/zoxide-query.1"
permissions = "644"
dest = "/usr/share/zoxide/man/man1/zoxide-query.1"

[[install_files]]
source = "man/man1/zoxide-init.1"
permissions = "644"
dest = "/usr/share/zoxide/man/man1/zoxide-init.1"

[[install_files]]
source = "man/man1/zoxide-import.1"
permissions = "644"
dest = "/usr/share/zoxide/man/man1/zoxide-import.1"

[[install_files]]
source = "completions/_zoxide"
permissions = "644"
dest = "/usr/share/zoxide/completions/_zoxide"

[[install_files]]
source = "completions/zoxide.ts"
permissions = "644"
dest = "/usr/share/zoxide/completions/zoxide.ts"

[[install_files]]
source = "completions/zoxide.fish"
permissions = "644"
dest = "/usr/share/zoxide/completions/zoxide.fish"

[[install_files]]
source = "completions/_zoxide.ps1"
permissions = "644"
dest = "/usr/share/zoxide/completions/_zoxide.ps1"

[[install_files]]
source = "completions/zoxide.elv"
permissions = "644"
dest = "/usr/share/zoxide/completions/zoxide.elv"

[[install_files]]
source = "completions/README.md"
permissions = "644"
dest = "/usr/share/zoxide/completions/README.md"

[[install_files]]
source = "completions/zoxide.nu"
permissions = "644"
dest = "/usr/share/zoxide/completions/zoxide.nu"

[[install_files]]
source = "completions/zoxide.bash"
permissions = "644"
dest = "/usr/share/zoxide/completions/zoxide.bash"

[cleanup]
files = "zoxide man/man1/zoxide.1 man/man1/zoxide-add.1 man/man1/zoxide-remove.1 man/man1/zoxide-query.1 man/man1/zoxide-init.1 man/man1/zoxide-import.1 completions/_zoxide completions/zoxide.ts completions/zoxide.fish completions/_zoxide.ps1 completions/zoxide.elv completions/README.md completions/zoxide.nu completions/zoxide.bash"